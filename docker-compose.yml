services:

  mongo:
    image: mongo:7
    container_name: studynow-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

      MONGO_APP_DB: ${MONGO_APP_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  app_blue:
    build:
      context: ./app

    container_name: studynow-app-blue
    restart: unless-stopped

    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_APP_DB}?authSource=${MONGO_APP_DB}
      APP_VERSION: ${APP_VERSION}
      FORCE_UNHEALTHY: ${FORCE_UNHEALTHY}

    depends_on:
      mongo:
        condition: service_healthy


  app_green:
    build:
      context: ./app

    container_name: studynow-app-green
    restart: unless-stopped

    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_APP_DB}?authSource=${MONGO_APP_DB}
      APP_VERSION: ${APP_VERSION}
      FORCE_UNHEALTHY: ${FORCE_UNHEALTHY}

    depends_on:
      mongo:
        condition: service_healthy


  nginx:
    image: nginx:alpine
    container_name: studynow-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - mongo


volumes:
  mongo_data: